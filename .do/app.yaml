# DigitalOcean App Platform specification for the classroom dashboard.
# Deploys apps/from-model-to-app (Node.js web interface + Python engine API)
# as one Docker-based web service straight from this GitHub repository. The
# local workflow (python launch.py) is unchanged; this file is only read by
# DigitalOcean.
#
# Use: DigitalOcean console -> Create App -> import this repo, or:
#   doctl apps create --spec .do/app.yaml
# For an existing app: Settings -> App Spec -> replace the services section
# with this one (keep the existing top-level name).
name: from-model-to-app
region: nyc
services:
  - name: dashboard
    dockerfile_path: apps/from-model-to-app/Dockerfile
    source_dir: apps/from-model-to-app
    github:
      repo: jrmst102/businessanalytics
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /healthz
      initial_delay_seconds: 30
